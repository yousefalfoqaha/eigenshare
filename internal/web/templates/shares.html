{{define "content"}}
<section class="title">
  <h1>shares</h1>
  <p><a href="/shares/new">+ new share</a></p>
</section>

<table>
  <thead>
    <tr>
      <th>handle</th>
      <th>files</th>
      <th>total size</th>
      <th>expires</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {{range .Shares}}
    <tr>
      <td><a href="/s/{{.Handle}}">{{.Handle}}</a></td>
      <td>{{.TotalFiles}}</td>
      <td>{{formatSize .TotalSize}}</td>
      <td>{{expiresIn .ExpiresAt}}</td>
      <td>
        <div class="row-actions">
          <a href="/shares/{{.Handle}}/edit">edit</a>

          <form
            method="post"
            action="/shares/{{.Handle}}/delete"
            class="inline"
          >
            <button type="submit">delete</button>
          </form>
        </div>
      </td>
    </tr>
    {{else}}
    <tr>
      <td colspan="5" class="empty-table">no shares yet</td>
    </tr>
    {{end}}
  </tbody>
</table>
{{end}}
