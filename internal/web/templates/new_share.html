{{define "content"}}
<h1>new share</h1>
<form id="new-share-form">
  <label
    >handle
    <input
      type="text"
      name="handle"
      id="handle-input"
      required
      pattern="[a-zA-Z0-9_-]{3,64}"
      minlength="3"
      autofocus
    />
  </label>

  <label
    >expiry (minutes, 0 = permanent)
    <input type="number" name="expiryMinutes" value="60" min="0" />
  </label>

  {{template "file-picker" "select files"}}

  <div id="status" role="status" aria-live="polite"></div>

  <button type="submit" id="create-btn" class="submit">create</button>
</form>

<p>
  <a href="/shares">back to shares</a>
</p>

<script src="/static/uploader.js"></script>
<script>
  const selectedFiles = window.filePicker.files;

  function randomHandle() {
    const chars =
      "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let s = "";
    for (let i = 0; i < 8; i++)
      s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  document.getElementById("handle-input").value = randomHandle();

  document
    .getElementById("new-share-form")
    .addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("create-btn");
      const status = document.getElementById("status");

      btn.disabled = true;
      status.textContent = "creating share...";

      const fd = new FormData(e.target);
      const req = {
        handle: fd.get("handle"),
        expiryMinutes: parseInt(fd.get("expiryMinutes") || "0", 10),
      };

      let share;
      try {
        const resp = await fetch("/shares", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(req),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.message || `create failed: ${resp.status}`);
        }

        share = await resp.json();
      } catch (err) {
        status.textContent = err.message;
        btn.disabled = false;
        return;
      }

      if (selectedFiles.length === 0) {
        window.location.href = `/s/${share.handle}`;
        return;
      }

      try {
        status.textContent = "registering files...";
        const files = await registerFiles(share.handle, selectedFiles);

        status.textContent = `uploading ${files.length} file(s)...`;

        for (let i = 0; i < files.length; i++) {
          const file = selectedFiles[i];
          await streamFile(share.handle, files[i].id, file, (bytesWritten) => {
            const percent = Math.round(
              (bytesWritten / file.size) * 100,
            );
            status.textContent = `uploading ${file.name}: ${percent}%`;
          });
        }

        status.textContent = "done. redirecting...";
        window.location.href = `/s/${share.handle}`;
      } catch (err) {
        status.textContent = err.message;
        window.location.href = `/shares/${share.handle}/edit`;
      }
    });
</script>
{{end}}
