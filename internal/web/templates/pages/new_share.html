{{define "title"}}new share{{end}} {{define "content"}}
<h1>new share</h1>
{{if .Demo}}
<p class="banner" data-info>demo: shares are limited to 1 MB and expire after 5 minutes</p>
{{end}}
<form method="post" action="/shares">
  <label
    >handle
    <input
      type="text"
      name="handle"
      id="handle-input"
      required
      pattern="[a-zA-Z0-9_-]{3,64}"
      minlength="3"
      maxlength="64"
      autofocus
    />
  </label>

  <label
    >expiry (minutes, 0 = permanent)
    {{if .Demo}}
    <input type="number" name="expiryMinutes" value="5" readonly />
    {{else}}
    <input type="number" name="expiryMinutes" value="60" min="0" />
    {{end}}
  </label>

  <label
    >max size (MB, 0 = unlimited)
    {{if .Demo}}
    <input type="number" name="maxSizeMB" value="1" readonly />
    {{else}}
    <input type="number" name="maxSizeMB" value="0" min="0" />
    {{end}}
  </label>

  <label
    >visibility
    <select name="visibility" id="visibility-select">
      <option value="private" selected>private (owners only)</option>
      <option value="public">public (anyone with the link)</option>
    </select>
  </label>

  <label
    >password (optional)
    <input type="password" name="password" minlength="3" maxlength="72" />
  </label>

  <button type="submit" class="submit">create</button>
</form>

<p><a href="/shares">back to shares</a></p>

<script>
  function randomHandle() {
    const chars =
      "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let s = "";
    for (let i = 0; i < 8; i++)
      s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  document.getElementById("handle-input").value = randomHandle();
</script>
{{end}}
