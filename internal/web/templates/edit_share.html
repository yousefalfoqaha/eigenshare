{{define "content"}}
<section class="title">
  <h1>{{.Share.Handle}}</h1>
  <a>+ add files</a>
</section>

<p>
  {{shareTotalFiles .Share}} file(s) - {{formatSize .BytesWritten}} total {{if
  .Complete}}<span class="done">(complete)</span>{{end}}
</p>

<table>
  <thead>
    <tr>
      <th>name</th>
      <th>size</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {{range .Share.Files}}
    <tr>
      <td>{{.Name}}</td>
      <td>{{formatSize .ExpectedSize}}</td>
      <td>
        <form
          method="post"
          action="/shares/{{$.Share.Handle}}/files/{{.ID}}/delete"
          class="inline"
        >
          <button type="submit">delete</button>
        </form>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>

<p>
  <a href="/shares">back to shares</a>
</p>
{{end}}
