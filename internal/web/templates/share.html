{{define "content"}}
<div class="title">
  <h1>{{.Share.Handle}}</h1>
  <form
    action="/s/{{.Share.Handle}}/download"
    method="get"
    style="display: inline"
  >
    <button class="submit" type="submit">download all (zip)</button>
  </form>
</div>

<p>
  {{shareTotalFiles .Share}} file(s) - {{shareTotalSize .Share | formatSize}}
  total
</p>

<table>
  <thead>
    <tr>
      <th>name</th>
      <th>size</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {{range .Share.Files}}
    <tr>
      <td>{{.Name}}</td>
      <td>{{formatSize .ExpectedSize}}</td>
      <td>
        <button href="/s/{{$.Share.Handle}}/files/{{.ID}}/download">
          download
        </button>
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
{{end}}
