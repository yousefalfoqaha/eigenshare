{{define "title"}}{{if .Content}}{{.Content.Username}}{{else}}new user{{end}}{{end}}
{{define "content"}}
<h1>{{if .Content}} {{.Content.Username}} {{else}}new user{{end}}</h1>
<form
  method="post"
  action="{{if .Content}}/users/{{.Content.ID}}{{else}}/users{{end}}"
>
  <label
    >username
    <input
      type="text"
      name="username"
      required
      value="{{if .Content}}{{.Content.Username}}{{end}}"
      autofocus
  /></label>
  <label
    >password (leave blank to keep current) {{if .Content}}{{end}}
    <input type="password" name="password" {{if not .Content}}required{{end}}
  /></label>
  <label class="inline"
    ><input
      type="checkbox"
      name="isAdmin"
      {{if
      .Content}}{{if
      .Content.IsAdmin}}checked{{end}}{{end}}
    />
    admin</label
  >
  <button type="submit" class="submit">
    {{if .Content}}update{{else}}create{{end}}
  </button>
</form>
<p><a href="/users">back to users</a></p>
{{end}}
