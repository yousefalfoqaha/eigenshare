{{define "title"}}new share{{end}} {{define "content"}}
<h1>new share</h1>
<form id="new-share-form">
  <label
    >handle
    <input
      type="text"
      name="handle"
      id="handle-input"
      required
      pattern="[a-zA-Z0-9_-]{3,64}"
      minlength="3"
      autofocus
    />
  </label>

  <label
    >expiry (minutes, 0 = permanent)
    <input type="number" name="expiryMinutes" value="60" min="0" />
  </label>

  <label
    >visibility
    <select name="visibility" id="visibility-select">
      <option value="private" selected>private (owners only)</option>
      <option value="public">public (anyone with the link)</option>
    </select>
  </label>

  <button type="submit" class="submit" id="create-btn">create share</button>
  <div
    id="create-error"
    class="error"
    style="display: none; margin-top: 1rem"
  ></div>
</form>

<p><a href="/shares">back to shares</a></p>

<script>
  function randomHandle() {
    const chars =
      "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let s = "";
    for (let i = 0; i < 8; i++)
      s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  document.getElementById("handle-input").value = randomHandle();

  document
    .getElementById("new-share-form")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("create-btn");
      const errEl = document.getElementById("create-error");
      btn.disabled = true;
      errEl.style.display = "none";

      const fd = new FormData(e.target);
      const req = {
        handle: fd.get("handle"),
        expiryMinutes: parseInt(fd.get("expiryMinutes") || "0", 10),
        visibility: fd.get("visibility") || "private",
      };

      try {
        const resp = await fetch("/api/shares", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(req),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.message || `create failed: ${resp.status}`);
        }

        const share = await resp.json();
        // Instantly redirect to the Edit page so they can upload files
        window.location.href = `/shares/${share.id}/edit`;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
        btn.disabled = false;
      }
    });
</script>
{{end}}
