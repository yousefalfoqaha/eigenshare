{{define "file-picker"}}
<fieldset data-file-picker>
  <legend>upload files</legend>
  <input type="file" data-file-input multiple hidden />
  <button type="button" data-file-select>Browse...</button>
  <ul class="file-picker-list" data-file-list></ul>
</fieldset>

<script>
  (() => {
    const picker = document.querySelector("[data-file-picker]");
    const input = picker.querySelector("[data-file-input]");
    const list = picker.querySelector("[data-file-list]");
    const files = [];

    window.filePicker = { files };

    function renderFiles() {
      list.replaceChildren();

      files.forEach((file, index) => {
        const row = document.createElement("li");
        row.className = "file-picker-row";

        const name = document.createElement("span");
        name.textContent = file.name;

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.textContent = "remove";
        removeButton.addEventListener("click", () => {
          files.splice(index, 1);
          renderFiles();
        });

        row.append(name, removeButton);
        list.appendChild(row);
      });
    }

    picker
      .querySelector("[data-file-select]")
      .addEventListener("click", () => input.click());

    input.addEventListener("change", () => {
      files.push(...input.files);
      input.value = "";
      renderFiles();
    });
  })();
</script>
{{end}}
