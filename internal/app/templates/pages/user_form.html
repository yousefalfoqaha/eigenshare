{{define "content"}}
<h1>{{if .Content.User}} {{.Content.User.Username}} {{else}}new user{{end}}</h1>
<form
  method="post"
  action="{{if .Content.User}}/users/{{.Content.User.ID}}{{else}}/users{{end}}"
>
  <label
    >username
    <input
      type="text"
      name="username"
      required
      value="{{if .Content.User}}{{.Content.User.Username}}{{end}}"
      autofocus
  /></label>
  <label
    >password (leave blank to keep current) {{if .Content.User}}{{end}}
    <input type="password" name="password" {{if not .Content.User}}required{{end}}
  /></label>
  <label class="inline"
    ><input
      type="checkbox"
      name="isAdmin"
      {{if
      .Content.User}}{{if
      .Content.User.IsAdmin}}checked{{end}}{{end}}
    />
    admin</label
  >
  <button type="submit" class="submit">
    {{if .Content.User}}update{{else}}create{{end}}
  </button>
</form>
<p><a href="/users">back to users</a></p>
{{end}}
