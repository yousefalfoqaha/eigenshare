{{define "content"}}
<h1>{{if .User}}edit user{{else}}new user{{end}}</h1>
<form
  method="post"
  action="{{if .User}}/users/{{.User.ID}}{{else}}/users{{end}}"
>
  <label
    >username
    <input
      type="text"
      name="username"
      required
      value="{{if .User}}{{.User.Username}}{{end}}"
      autofocus
  /></label>
  <label
    >password (leave blank to keep current) {{if .User}}{{end}}
    <input type="password" name="password" {{if not .User}}required{{end}}
  /></label>
  <label class="inline"
    ><input
      type="checkbox"
      name="isAdmin"
      {{if
      .User}}{{if
      .User.IsAdmin}}checked{{end}}{{end}}
    />
    admin</label
  >
  <button type="submit" class="submit">
    {{if .User}}update{{else}}create{{end}}
  </button>
</form>
<p><a href="/users">back to users</a></p>
{{end}}
